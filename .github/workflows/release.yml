name: Release sideload APK

# Cuts a signed sideload APK and attaches it to a GitHub Release.
# Trigger: push a tag like v157 (tag number == versionCode == revisions.txt entry).
#
# Required repository Secrets (Settings > Secrets and variables > Actions):
#   CARLINK_KEYSTORE_BASE64    - base64 of your release keystore:  base64 -i release.jks | pbcopy
#   CARLINK_KEYSTORE_PASSWORD  - keystore (store) password
#   CARLINK_KEY_ALIAS          - key alias inside the keystore
#   CARLINK_KEY_PASSWORD       - key password for that alias
#
# Only the sideload flavor is built. The play AAB is intentionally not produced here:
# the GM radio accepts apps only via Play Internal Testing through each user's own Dev
# Console, so forks publish that themselves with their own package name and signing key.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the Release and upload the APK asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A JDK to bootstrap Gradle. gradle-daemon-jvm.properties pins the daemon JVM to
      # JetBrains Runtime 21, which Gradle auto-provisions via the foojay URLs in that file
      # on first run (setup-java has no 'jetbrains' distribution, so we can't supply it directly).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.CARLINK_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed sideload release APK
        env:
          CARLINK_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          CARLINK_KEYSTORE_PASSWORD: ${{ secrets.CARLINK_KEYSTORE_PASSWORD }}
          CARLINK_KEY_ALIAS: ${{ secrets.CARLINK_KEY_ALIAS }}
          CARLINK_KEY_PASSWORD: ${{ secrets.CARLINK_KEY_PASSWORD }}
        # Override the buildDir redirect (default ~/.cache/gradle-builds, for the iCloud
        # workaround) to a workspace path so the APK is easy to locate here.
        run: ./gradlew assembleSideloadRelease -Pcarlink.buildRoot="$GITHUB_WORKSPACE/build-out"

      - name: Locate APK
        id: apk
        run: |
          apk=$(find "$GITHUB_WORKSPACE/build-out" -path '*sideload/release/*.apk' | head -1)
          if [ -z "$apk" ]; then echo "No APK found" >&2; exit 1; fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "Found: $apk"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
